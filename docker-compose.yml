version: '3.8'

services:
  db:
    container_name: tradeit_db
    image: postgres
    user: 1000:1000
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=dev123
      - POSTGRES_DB=tradeit
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: tradeit_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  user-order-service:
    build:
      context: .
      dockerfile: services/user-order-service/Dockerfile
    container_name: tradeit_user_order_service
    ports:
      - "8000:8000"
    environment:
      - redis_addr=redis:6379
      - redis_password=
    depends_on:
      - db
      - redis
    networks:
      - tradeit_network

  engine-service:
    build:
      context: .
      dockerfile: services/engine-service/Dockerfile
    container_name: tradeit_engine_service
    ports:
      - "8001:8001"
    environment:
      - redis_addr=redis:6379
      - redis_password=
    depends_on:
      - db
      - redis
    networks:
      - tradeit_network

volumes:
  postgres_data:
  redis_data:

networks:
  tradeit_network:
    driver: bridge
